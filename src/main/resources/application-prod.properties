spring.application.name=ChessForge

# ===============================
# DATABASE
# ===============================

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jpa.open-in-view=false

# ===============================
# THYMELEAF
# ===============================

spring.thymeleaf.cache=true

# ===============================
# SERVER
# ===============================

server.port=${PORT:8080}

server.servlet.session.timeout=30m

server.forward-headers-strategy=framework

# ===============================
# CHESSFORGE
# ===============================

chessforge.game.timeout-check-delay-ms=1000
chessforge.tournament.round-check-delay-ms=1000
chessforge.tournament.start-check-delay-ms=1000