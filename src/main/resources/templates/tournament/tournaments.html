<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Tournaments | ChessForge</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container py-4">

    <div class="d-flex
                justify-content-between
                align-items-center
                mb-4">
        <a th:href="@{/tournaments/create}"
           class="btn btn-primary">
            Create Tournament
        </a>

        <div>

            <h1 class="mb-1">
                Tournaments
            </h1>

            <p class="text-body-secondary mb-0">
                Browse ChessForge tournaments
            </p>

        </div>

    </div>


    <div th:if="${#lists.isEmpty(tournaments)}"
         class="alert alert-secondary">

        No tournaments are available yet.

    </div>


    <div class="row g-3"
         th:unless="${#lists.isEmpty(tournaments)}">

        <div class="col-12 col-lg-6"
             th:each="tournament : ${tournaments}">

            <div class="card h-100">
                <div class="col-12"
                     th:if="${tournament.updatedAt != null}">

                    <strong>
                        Last updated
                    </strong>

                    <div class="text-body-secondary"
                         th:text="${#temporals.format(
             tournament.updatedAt,
             'dd MMM yyyy HH:mm'
         )}">
                        15 Sep 2026 01:20
                    </div>

                </div>

                <div class="card-body">

                    <div class="d-flex
                                justify-content-between
                                align-items-start
                                gap-3">

                        <div>

                            <h5 class="card-title mb-1">

                                <a th:href="@{/tournaments/{id}(id=${tournament.id})}"
                                   class="text-decoration-none text-body"
                                   th:text="${tournament.name}">
                                    Tournament
                                </a>

                            </h5>

                            <div class="text-body-secondary small">

                                Created by

                                <span th:text="${tournament.creatorUsername}">
                                    player
                                </span>

                            </div>

                        </div>


                        <span class="badge text-bg-secondary"
                              th:text="${tournament.status}">
                            REGISTRATION
                        </span>

                    </div>


                    <hr>


                    <div class="row g-2 small">

                        <div class="col-6">

                            <strong>
                                Format
                            </strong>

                            <div th:text="${tournament.format}">
                                SWISS
                            </div>

                        </div>


                        <div class="col-6">

                            <strong>
                                Time control
                            </strong>

                            <div th:text="${tournament.timeControl}">
                                BLITZ
                            </div>

                        </div>


                        <div class="col-6">

                            <strong>
                                Rated
                            </strong>

                            <div th:text="${tournament.rated ? 'Yes' : 'No'}">
                                Yes
                            </div>

                        </div>


                        <div class="col-6">

                            <strong>
                                Max players
                            </strong>

                            <div th:text="${tournament.maxPlayers != null
                                    ? tournament.maxPlayers
                                    : 'Unlimited'}">
                                16
                            </div>

                        </div>


                        <div class="col-12"
                             th:if="${tournament.startsAt != null}">

                            <strong>
                                Starts
                            </strong>

                            <div th:text="${#temporals.format(
                                    tournament.startsAt,
                                    'dd MMM yyyy HH:mm'
                            )}">
                                14 Sep 2026 20:00
                            </div>

                        </div>

                    </div>

                    <div class="mt-3">

                        <a th:href="@{/tournaments/{id}(id=${tournament.id})}"
                           class="btn btn-primary w-100">
                            View Tournament
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
