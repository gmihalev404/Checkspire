<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Create Tournament | ChessForge</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container py-4"
     style="max-width: 760px;">

    <div class="mb-4">

        <a th:href="@{/tournaments}"
           class="text-decoration-none">
            ← Tournaments
        </a>

        <h1 class="mt-3 mb-1">
            Create Tournament
        </h1>

        <p class="text-body-secondary">
            Configure a new ChessForge tournament.
        </p>

    </div>


    <div th:if="${error != null}"
         class="alert alert-danger"
         th:text="${error}">
    </div>


    <form th:action="@{/tournaments}"
          th:object="${request}"
          method="post">

        <div class="mb-3">

            <label for="name"
                   class="form-label">
                Tournament name
            </label>

            <input id="name"
                   type="text"
                   class="form-control"
                   th:field="*{name}"
                   maxlength="100"
                   required>

        </div>


        <div class="row g-3 mb-3">

            <div class="col-md-6">

                <label for="format"
                       class="form-label">
                    Format
                </label>

                <select id="format"
                        class="form-select"
                        th:field="*{format}"
                        required>

                    <option value="">
                        Select format
                    </option>

                    <option th:each="format : ${formats}"
                            th:value="${format}"
                            th:text="${#strings.replace(format.name(), '_', ' ')}">
                    </option>

                </select>

            </div>


            <div class="col-md-6">

                <label for="timeControl"
                       class="form-label">
                    Time control
                </label>

                <select id="timeControl"
                        class="form-select"
                        th:field="*{timeControl}"
                        required>

                    <option value="">
                        Select time control
                    </option>

                    <option th:each="timeControl : ${timeControls}"
                            th:value="${timeControl}"
                            th:text="${#strings.replace(timeControl.name(), '_', ' ')}">
                    </option>

                </select>

            </div>

        </div>


        <div class="row g-3 mb-3">

            <div class="col-md-6">

                <label for="maxPlayers"
                       class="form-label">
                    Max players
                </label>

                <input id="maxPlayers"
                       type="number"
                       class="form-control"
                       th:field="*{maxPlayers}"
                       min="2"
                       placeholder="Unlimited">

                <div class="form-text">
                    Leave empty for no fixed limit.
                </div>

            </div>


            <div class="col-md-6">

                <label for="startsAt"
                       class="form-label">
                    Start time
                </label>

                <input id="startsAt"
                       type="datetime-local"
                       class="form-control"
                       required
                       th:field="*{startsAt}">

            </div>

        </div>

        <div class="row g-3 mb-4">

            <div class="col-md-6">

                <label for="roundBreakMinutes"
                       class="form-label">
                    Break between rounds
                </label>

                <input id="roundBreakMinutes"
                       type="number"
                       class="form-control"
                       th:field="*{roundBreakMinutes}"
                       min="0"
                       required>

                <div class="form-text">
                    Minutes between tournament rounds.
                </div>

            </div>

            <div class="col-md-6 d-flex align-items-end">

                <div class="form-check mb-2">

                    <input id="automaticStart"
                           type="checkbox"
                           class="form-check-input"
                           th:field="*{automaticStart}">

                    <label for="automaticStart"
                           class="form-check-label">
                        Start tournament automatically
                    </label>

                    <div class="form-text">
                        Starts automatically at the scheduled start time.
                    </div>

                </div>

            </div>

        </div>


        <div class="form-check mb-4">

            <input id="rated"
                   type="checkbox"
                   class="form-check-input"
                   th:field="*{rated}">

            <label for="rated"
                   class="form-check-label">
                Rated tournament
            </label>

        </div>


        <hr>


        <h5 class="mb-3">
            Tournament scoring
        </h5>


        <div class="mb-3">

            <label for="byePoints"
                   class="form-label">
                Bye points
            </label>

            <input id="byePoints"
                   type="number"
                   class="form-control"
                   th:field="*{byePoints}"
                   min="0"
                   max="1"
                   step="0.5"
                   required>

        </div>


        <div class="mb-4">

            <label class="form-label">
                Tie-breaks
            </label>

            <div class="form-check"
                 th:each="tieBreak : ${tieBreaks}">

                <input class="form-check-input"
                       type="checkbox"
                       th:field="*{tieBreaks}"
                       th:value="${tieBreak}"
                       th:id="${'tieBreak-' + tieBreak.name()}">

                <label class="form-check-label"
                       th:for="${'tieBreak-' + tieBreak.name()}"
                       th:text="${#strings.replace(tieBreak.name(), '_', ' ')}">
                </label>

            </div>

        </div>


        <div id="swiss-options"
             class="border rounded p-3 mb-4 d-none">

            <h5>
                Swiss options
            </h5>


            <div class="mb-3">

                <label for="numberOfRounds"
                       class="form-label">
                    Number of rounds
                </label>

                <input id="numberOfRounds"
                       type="number"
                       class="form-control"
                       th:field="*{numberOfRounds}"
                       min="1">

            </div>

        </div>


        <div class="form-check mb-4">

            <input id="armageddon"
                   type="checkbox"
                   class="form-check-input"
                   th:field="*{armageddonForFirstPlaceTie}">

            <label for="armageddon"
                   class="form-check-label">
                Use Armageddon for first-place tie
            </label>

        </div>


        <div class="d-flex gap-2">

            <button type="submit"
                    class="btn btn-primary">
                Create Tournament
            </button>

            <a th:href="@{/tournaments}"
               class="btn btn-outline-secondary">
                Cancel
            </a>

        </div>

    </form>

</div>


<script th:src="@{/js/tournament-create.js}">
</script>

</body>

</html>
