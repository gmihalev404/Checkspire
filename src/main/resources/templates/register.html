<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      data-bs-theme="dark">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Register | Checkspire</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link th:href="@{/css/app.css}"
          rel="stylesheet">

    <link rel="icon"
          type="image/png"
          th:href="@{/favicon.png}">

</head>

<body class="cf-auth-body">


<main class="container cf-container">

    <div class="cf-auth-layout">


        <!-- ================================================= -->
        <!-- BRAND -->
        <!-- ================================================= -->

        <section class="cf-auth-brand">


            <a th:href="@{/}"
               class="cf-brand text-decoration-none mb-5">

                <span class="cf-brand-icon">
                    ♞
                </span>

                <span>
                    Check<span class="cf-brand-accent">spire</span>
                </span>

            </a>


            <div>

                <span class="cf-eyebrow">
                    Join Checkspire
                </span>

                <h1 class="cf-auth-heading">
                    Forge your rating.
                </h1>

                <p class="cf-auth-description">

                    Create an account, challenge players
                    and start competing in tournaments.

                </p>

            </div>

        </section>


        <!-- ================================================= -->
        <!-- FORM -->
        <!-- ================================================= -->

        <section class="cf-auth-card">


            <div class="mb-4">

                <h2 class="h3 fw-bold mb-2">
                    Create account
                </h2>

                <p class="cf-muted mb-0">
                    Start playing on Checkspire.
                </p>

            </div>


            <div th:if="${error}"
                 th:text="${error}"
                 class="alert alert-danger"
                 role="alert">
            </div>


            <form th:action="@{/register}"
                  th:object="${registerRequest}"
                  method="post">


                <div class="mb-3">

                    <label for="username"
                           class="form-label fw-semibold">

                        Username

                    </label>

                    <input id="username"
                           type="text"
                           class="form-control"
                           th:field="*{username}"
                           maxlength="30"
                           autocomplete="username"
                           required>

                </div>


                <div class="mb-3">

                    <label for="email"
                           class="form-label fw-semibold">

                        Email

                    </label>

                    <input id="email"
                           type="email"
                           class="form-control"
                           th:field="*{email}"
                           autocomplete="email"
                           required>

                </div>


                <div class="mb-3">

                    <label for="password"
                           class="form-label fw-semibold">

                        Password

                    </label>

                    <input id="password"
                           type="password"
                           class="form-control"
                           th:field="*{password}"
                           autocomplete="new-password"
                           required>

                </div>


                <div class="mb-4">

                    <label for="confirmPassword"
                           class="form-label fw-semibold">

                        Confirm password

                    </label>

                    <input id="confirmPassword"
                           type="password"
                           class="form-control"
                           th:field="*{confirmPassword}"
                           autocomplete="new-password"
                           required>

                </div>


                <button type="submit"
                        class="btn cf-btn-primary btn-lg w-100">

                    Create account

                </button>

            </form>


            <div class="cf-auth-divider">
                <span></span>
            </div>


            <p class="text-center cf-muted mb-0">

                Already have an account?

                <a th:href="@{/login}"
                   class="cf-auth-link">

                    Log in

                </a>

            </p>

        </section>

    </div>

</main>


</body>

</html>
