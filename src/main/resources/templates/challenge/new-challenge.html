<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      data-bs-theme="dark">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>New Challenge | Checkspire</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link th:href="@{/css/app.css}"
          rel="stylesheet">

    <link rel="icon"
          type="image/png"
          th:href="@{/favicon.png}">

</head>

<body>


<div th:replace="~{fragments/navbar :: navbar}">
</div>


<main class="container cf-container cf-page">

    <div class="row justify-content-center">

        <div class="col-12 col-md-9 col-lg-7 col-xl-6">


            <!-- Back -->
            <div class="mb-3">

                <a th:href="@{/challenges}"
                   class="text-decoration-none cf-muted">

                    ← Back to Challenges

                </a>

            </div>


            <section class="cf-card">

                <div class="p-4 p-md-5">

                    <span class="cf-eyebrow">
                        New match
                    </span>

                    <h1 class="h2 fw-bold mb-2">
                        Create Challenge
                    </h1>

                    <p class="cf-muted mb-4">
                        Choose an opponent and configure your game.
                    </p>


                    <div th:if="${error}"
                         class="alert alert-danger"
                         th:text="${error}">
                    </div>


                    <form th:action="@{/challenges}"
                          th:object="${challengeRequest}"
                          method="post">


                        <!-- Opponent -->
                        <div class="mb-4">

                            <label for="opponentUsername"
                                   class="form-label fw-semibold">

                                Opponent username

                            </label>

                            <input id="opponentUsername"
                                   type="text"
                                   class="form-control"
                                   th:field="*{opponentUsername}"
                                   placeholder="Enter username"
                                   required>

                        </div>


                        <!-- Time control -->
                        <div class="mb-4">

                            <label for="timeControl"
                                   class="form-label fw-semibold">

                                Time control

                            </label>

                            <select id="timeControl"
                                    class="form-select"
                                    th:field="*{timeControl}">

                                <option th:each="control : ${timeControls}"
                                        th:value="${control}"
                                        th:text="${#strings.replace(
                                            control.name(),
                                            '_',
                                            ' '
                                        )}">
                                </option>

                            </select>

                        </div>


                        <!-- Color -->
                        <div class="mb-4">

                            <label for="colorPreference"
                                   class="form-label fw-semibold">

                                Your color

                            </label>

                            <select id="colorPreference"
                                    class="form-select"
                                    th:field="*{colorPreference}">

                                <option th:each="color : ${colorPreferences}"
                                        th:value="${color}"
                                        th:text="${#strings.replace(
                                            color.name(),
                                            '_',
                                            ' '
                                        )}">
                                </option>

                            </select>

                        </div>


                        <!-- Rated -->
                        <div class="cf-challenge-option mb-4">

                            <div>

                                <label for="rated"
                                       class="fw-semibold mb-1">

                                    Rated game

                                </label>

                                <div class="small cf-muted">
                                    The result will affect both players' ratings.
                                </div>

                            </div>


                            <div class="form-check form-switch m-0">

                                <input id="rated"
                                       type="checkbox"
                                       class="form-check-input"
                                       th:field="*{rated}">

                            </div>

                        </div>


                        <!-- Submit -->
                        <div class="d-grid">

                            <button type="submit"
                                    class="btn cf-btn-primary btn-lg">

                                Send Challenge

                            </button>

                        </div>

                    </form>

                </div>

            </section>

        </div>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
