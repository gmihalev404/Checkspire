<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      data-bs-theme="dark">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>New Challenge | ChessForge</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-body-tertiary">

<nav class="navbar bg-body border-bottom">

  <div class="container">

    <a class="navbar-brand fw-bold"
       th:href="@{/}">
      ChessForge
    </a>

    <div class="d-flex gap-3 align-items-center">

      <a th:href="@{/challenges}"
         class="btn btn-outline-secondary btn-sm">
        Challenges
      </a>

      <span th:text="${username}">
                username
            </span>

    </div>

  </div>

</nav>


<main class="container py-5">

  <div class="row justify-content-center">

    <div class="col-12 col-md-8 col-lg-6">


      <div class="card border-0 shadow-sm">

        <div class="card-body p-4 p-md-5">

          <h2 class="fw-bold mb-4">
            New Challenge
          </h2>


          <div th:if="${error}"
               class="alert alert-danger"
               th:text="${error}">
          </div>


          <form th:action="@{/challenges}"
                th:object="${challengeRequest}"
                method="post">


            <div class="mb-3">

              <label for="opponentUsername"
                     class="form-label">

                Opponent username

              </label>

              <input id="opponentUsername"
                     type="text"
                     class="form-control"
                     th:field="*{opponentUsername}"
                     required>

            </div>


            <div class="mb-3">

              <label for="timeControl"
                     class="form-label">

                Time control

              </label>

              <select id="timeControl"
                      class="form-select"
                      th:field="*{timeControl}">

                <option th:each="control : ${timeControls}"
                        th:value="${control}"
                        th:text="${control}">
                </option>

              </select>

            </div>


            <div class="mb-3">

              <label for="colorPreference"
                     class="form-label">

                Your color

              </label>

              <select id="colorPreference"
                      class="form-select"
                      th:field="*{colorPreference}">

                <option th:each="color : ${colorPreferences}"
                        th:value="${color}"
                        th:text="${color}">
                </option>

              </select>

            </div>


            <div class="form-check mb-4">

              <input id="rated"
                     type="checkbox"
                     class="form-check-input"
                     th:field="*{rated}">

              <label for="rated"
                     class="form-check-label">

                Rated game

              </label>

            </div>


            <div class="d-grid">

              <button type="submit"
                      class="btn btn-primary">

                Send Challenge

              </button>

            </div>

          </form>

        </div>

      </div>

    </div>

  </div>

</main>

</body>
</html>
