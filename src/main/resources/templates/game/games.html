<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      data-bs-theme="dark">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Games | ChessForge</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link th:href="@{/css/app.css}"
          rel="stylesheet">

</head>

<body>


<div th:replace="~{fragments/navbar :: navbar}">
</div>


<main class="container cf-container cf-page">


    <!-- ===================================================== -->
    <!-- HEADER -->
    <!-- ===================================================== -->

    <div class="d-flex
                flex-column
                flex-md-row
                justify-content-between
                align-items-md-center
                gap-3
                mb-4">

        <div>

            <span class="cf-eyebrow">
                Your chess
            </span>

            <h1 class="fw-bold mb-1">
                My Games
            </h1>

            <p class="cf-muted mb-0">
                Continue active games and review previous matches.
            </p>

        </div>


        <a th:href="@{/challenges/new}"
           class="btn cf-btn-primary">

            New Game

        </a>

    </div>


    <!-- ===================================================== -->
    <!-- EMPTY -->
    <!-- ===================================================== -->

    <div th:if="${#lists.isEmpty(games)}"
         class="cf-card">

        <div class="text-center py-5 px-3">

            <div class="cf-feature-icon mx-auto">
                ♟
            </div>

            <h2 class="h5 fw-bold">
                No games yet
            </h2>

            <p class="cf-muted mb-4">
                Your games will appear here once you start playing.
            </p>

            <a th:href="@{/challenges/new}"
               class="btn cf-btn-primary">

                Start a Game

            </a>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- GAME LIST -->
    <!-- ===================================================== -->

    <div th:unless="${#lists.isEmpty(games)}"
         class="cf-game-list">


        <div th:each="game : ${games}"
             class="cf-game-row">


            <!-- Opponent -->
            <div class="cf-game-opponent">

                <strong th:text="${game.opponentUsername}">
                    opponent
                </strong>

                <span th:if="${game.startedAt != null}"
                      class="cf-game-date"
                      th:text="${#temporals.format(
              game.startedAt,
              'dd MMM yyyy HH:mm'
          )}">
        16 Sep 2026 18:30
    </span>

                <span th:if="${game.startedAt == null}"
                      class="cf-game-date">
        Not started
    </span>

            </div>


            <!-- Metadata -->
            <div class="cf-game-meta">


                <!-- Color -->
                <span class="cf-color-square
                             cf-tooltip"
                      th:classappend="${game.white
                          ? ' cf-color-white'
                          : ' cf-color-black'}"
                      th:attr="data-tooltip=${game.white
                          ? 'White'
                          : 'Black'}"
                      tabindex="0">
                </span>


                <!-- Time control -->
                <span class="cf-time-control
                             cf-tooltip"
                      th:attr="data-tooltip=${game.timeControl.type
                          + ' · '
                          + game.timeControl.displayTime}"
                      tabindex="0">


                    <span class="cf-time-icon"
                          th:switch="${game.timeControl.type.name()}">

<span th:case="'BULLET'"
      class="cf-bullet-icon"
      aria-label="Bullet">
</span>

                        <span th:case="'BLITZ'">
                            ⚡
                        </span>

                        <span th:case="'RAPID'">
                            ◷
                        </span>

                        <span th:case="'CLASSICAL'">
                            ⌛
                        </span>

                    </span>


                    <span th:text="${game.timeControl.displayTime}">
                        1 + 0
                    </span>

                </span>


                <!-- Rated / Casual -->
                <span class="cf-game-indicator
                             cf-tooltip"
                      th:classappend="${game.rated
                          ? ' cf-rated'
                          : ' cf-casual'}"
                      th:attr="data-tooltip=${game.rated
                          ? 'Rated'
                          : 'Casual'}"
                      tabindex="0">

                    <span th:text="${game.rated
                        ? '◆'
                        : '◇'}">
                        ◆
                    </span>

                </span>


                <!-- Status -->
                <span th:switch="${game.status.name()}">

                    <span th:case="'WAITING'"
                          class="cf-status-dot
                                 cf-status-waiting
                                 cf-tooltip"
                          data-tooltip="Waiting"
                          tabindex="0">
                    </span>

                    <span th:case="'IN_PROGRESS'"
                          class="cf-status-dot
                                 cf-status-live
                                 cf-tooltip"
                          data-tooltip="In progress"
                          tabindex="0">
                    </span>

                    <span th:case="'FINISHED'"
                          class="cf-status-dot
                                 cf-status-finished
                                 cf-tooltip"
                          data-tooltip="Finished"
                          tabindex="0">
                    </span>

                    <span th:case="'ABORTED'"
                          class="cf-status-dot
                                 cf-status-aborted
                                 cf-tooltip"
                          data-tooltip="Aborted"
                          tabindex="0">
                    </span>

                </span>


                <!-- No result -->
                <span th:if="${game.result == null}"
                      class="cf-game-result
                             cf-result-pending
                             cf-tooltip"
                      data-tooltip="No result"
                      tabindex="0">
                    —
                </span>


                <!-- Draw -->
                <span th:if="${game.result != null
                              and game.result.name() == 'DRAW'}"
                      class="cf-game-result
                             cf-result-draw
                             cf-tooltip"
                      data-tooltip="Draw"
                      tabindex="0">
                    ½
                </span>


                <!-- Win -->
                <span th:if="${game.result != null
                              and game.result.name() != 'DRAW'
                              and (
                                  (game.white
                                   and game.result.name() == 'WHITE_WIN')
                                  or
                                  (!game.white
                                   and game.result.name() == 'BLACK_WIN')
                              )}"
                      class="cf-game-result
                             cf-result-win
                             cf-tooltip"
                      data-tooltip="Win"
                      tabindex="0">
                    ✓
                </span>


                <!-- Loss -->
                <span th:if="${game.result != null
                              and game.result.name() != 'DRAW'
                              and (
                                  (game.white
                                   and game.result.name() == 'BLACK_WIN')
                                  or
                                  (!game.white
                                   and game.result.name() == 'WHITE_WIN')
                              )}"
                      class="cf-game-result
                             cf-result-loss
                             cf-tooltip"
                      data-tooltip="Loss"
                      tabindex="0">
                    ×
                </span>

            </div>


            <!-- Open -->
            <a th:href="@{/games/{id}(
                   id=${game.gameId}
               )}"
               class="btn
                      btn-sm
                      cf-btn-ghost
                      cf-game-open">

                Open

            </a>

        </div>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
