spring.application.name=Checkspire

# ===============================
# DATABASE
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/checkspire?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jpa.open-in-view=false

# ===============================
# THYMELEAF
# ===============================

spring.thymeleaf.cache=false

# ===============================
# SERVER
# ===============================

server.servlet.session.timeout=30m

# ===============================
# CHECKSPIRE
# ===============================

checkspire.game.timeout-check-delay-ms=1000
checkspire.tournament.round-check-delay-ms=1000
checkspire.tournament.start-check-delay-ms=1000

# ===============================
# LOGGING
# ===============================

#logging.level.org.springframework=INFO
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.orm.jdbc.bind=TRACE