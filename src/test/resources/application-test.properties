spring.application.name=ChessForge

# ===============================
# TEST DATABASE - H2
# ===============================

spring.datasource.url=jdbc:h2:mem:chessforge_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.open-in-view=false

# ===============================
# THYMELEAF
# ===============================

spring.thymeleaf.cache=false

# ===============================
# SCHEDULERS
# ===============================

chessforge.game.timeout-check-delay-ms=1000
chessforge.tournament.round-check-delay-ms=1000
chessforge.tournament.start-check-delay-ms=1000